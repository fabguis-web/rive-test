<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #rive-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      object-fit: contain;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const canvas = document.getElementById("rive-canvas");

    function getTargetDimensions() {
      const params = new URLSearchParams(window.location.search);
      const paramW = parseInt(params.get("w"), 10);
      const paramH = parseInt(params.get("h"), 10);

      // If w/h passed from Salesforce, use them; otherwise use full inner window
      const w = (!isNaN(paramW) && paramW > 0) ? paramW : window.innerWidth;
      const h = (!isNaN(paramH) && paramH > 0) ? paramH : window.innerHeight;
      return { w, h };
    }

    function syncCanvasResolution() {
      const { w, h } = getTargetDimensions();
      const dpr = window.devicePixelRatio || 1;
      
      // Match the physical pixel buffer to display resolution (prevents pixelation)
      canvas.width = w * dpr;
      canvas.height = h * dpr;
    }

    syncCanvasResolution();

    const r = new rive.Rive({
      src: "https://fabguis-web.github.io/rive-test/round.riv",
      canvas: canvas,
      stateMachines: "State Machine 1",
      autoplay: true,
      automaticallyHandleEvents: false,
      layout: new rive.Layout({
        fit: rive.Fit.Contain, // Keeps artwork crisp within bounds
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        syncCanvasResolution();
      }
    });

    window.addEventListener("resize", () => {
      syncCanvasResolution();
      if (r) {
        r.startRendering();
      }
    });
  </script>

</body>
</html>
