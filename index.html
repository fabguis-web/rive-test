<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #rive-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      object-fit: contain;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@2.49.0"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const canvas = document.getElementById("rive-canvas");

    const r = new rive.Rive({
      src: "https://fabguis-web.github.io/rive-test/round.riv",
      canvas: canvas,
      stateMachines: "State Machine 1",
      autoplay: true,
      automaticallyHandleEvents: false,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
      }
    });

    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>

</body>
</html>
