<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #rive-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const canvas = document.getElementById("rive-canvas");

    function updateSurface() {
      const rect = canvas.getBoundingClientRect();
      const w = Math.round(rect.width) || 300;
      const h = Math.round(rect.height) || 300;
      canvas.width = w;
      canvas.height = h;
    }

    // Measure bounding box BEFORE Rive initializes
    updateSurface();

    const r = new rive.Rive({
      src: "round.riv",
      canvas: canvas,
      stateMachines: "State Machine 1",
      autoplay: true,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        updateSurface();
        // Do NOT call r.resizeDrawingSurfaceToCanvas() here!
        // It overrides canvas.width/height with window inner dimensions.
      }
    });

    const observer = new ResizeObserver(() => {
      updateSurface();
      if (r) {
        r.startRendering();
      }
    });
    observer.observe(document.body);
  </script>

</body>
</html>
