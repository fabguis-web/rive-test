<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #rive-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      object-fit: contain;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const canvas = document.getElementById("rive-canvas");

    function getTargetDimensions() {
      const params = new URLSearchParams(window.location.search);
      // Read explicit w/h parameters passed from Salesforce, or fall back to frame size
      const paramW = parseInt(params.get("w"), 10);
      const paramH = parseInt(params.get("h"), 10);

      const w = paramW || window.innerWidth || 150;
      const h = paramH || window.innerHeight || 150;
      return { w, h };
    }

    function applySurfaceSize() {
      const { w, h } = getTargetDimensions();
      canvas.width = w;
      canvas.height = h;
    }

    applySurfaceSize();

    const r = new rive.Rive({
      src: "round.riv",
      canvas: canvas,
      stateMachines: "State Machine 1",
      autoplay: true,
      automaticallyHandleEvents: false,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        applySurfaceSize();
      }
    });

    window.addEventListener("resize", () => {
      applySurfaceSize();
      if (r) {
        r.startRendering();
      }
    });
  </script>

</body>
</html>
