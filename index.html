<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #rive-canvas {
      width: 100%;
      height: 100%;
      display: block;
      visibility: hidden;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>
  <canvas id="rive-canvas"></canvas>
  <script>
    const rivUrl = new URL("round.riv", window.location.href).href;
    const canvasElement = document.getElementById("rive-canvas");

    const r = new rive.Rive({
      src: rivUrl,
      canvas: canvasElement,
      autoplay: true,
      /* Automatically play the main timeline animation directly */
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        
        /* If your animation timeline has a specific name in Rive, pass it inside r.play() */
        const anims = r.animationNames;
        if (anims && anims.length > 0) {
          r.play(anims[0]);
        } else {
          r.play();
        }
        
        canvasElement.style.visibility = "visible";
      },
      onLoadError: (err) => {
        console.error("Rive Asset Load Failure:", err);
      }
    });

    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
