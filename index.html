<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Force the canvas element bounds to strictly follow body size */
    #rive-canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block;
      object-fit: contain;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const canvas = document.getElementById("rive-canvas");

    const r = new rive.Rive({
      src: "round.riv",
      canvas: canvas,
      stateMachines: "State Machine 1",
      autoplay: true,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        // Sync internal drawing surface strictly to element client dimensions
        canvas.width = canvas.clientWidth || 300;
        canvas.height = canvas.clientHeight || 300;
        r.resizeDrawingSurfaceToCanvas();
      }
    });

    // Handle dynamic scaling when Salesforce size changes
    window.addEventListener("resize", () => {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      if (r) r.resizeDrawingSurfaceToCanvas();
    });
  </script>

</body>
</html>
