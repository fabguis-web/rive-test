<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #rive-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const canvas = document.getElementById("rive-canvas");

    const params = new URLSearchParams(window.location.search);
    const targetW = parseInt(params.get("w"), 10) || 150;
    const targetH = parseInt(params.get("h"), 10) || 150;

    canvas.width = targetW;
    canvas.height = targetH;

    const r = new rive.Rive({
      src: "round.riv",
      canvas: canvas,
      stateMachines: "State Machine 1",
      autoplay: true,
      automaticallyHandleEvents: false,
      layout: new rive.Layout({
        fit: rive.Fit.Cover, // Zooms past transparent artboard padding to fill frame bounds
        alignment: rive.Alignment.Center
      })
    });
  </script>

</body>
</html>
