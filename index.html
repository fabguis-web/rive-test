<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #rive-canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* Hide canvas during WASM compile to prevent the Rive logo flash */
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>
  <canvas id="rive-canvas"></canvas>
  <script>
    const rivUrl = new URL("round.riv", window.location.href).href;

    const r = new rive.Rive({
      src: rivUrl,
      canvas: document.getElementById("rive-canvas"),
      autoplay: true,
      stateMachines: "State Machine 1",
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        // Reveal canvas only after asset is compiled and ready
        document.getElementById("rive-canvas").style.opacity = "1";
      },
      onLoadError: (err) => {
        console.error("Rive Asset Load Failure:", err);
      }
    });

    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
