<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #rive-canvas {
      display: block;
      object-fit: contain;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const canvas = document.getElementById("rive-canvas");

    function getValidDimension(paramValue, fallbackWindowVal) {
      const parsed = parseInt(paramValue, 10);
      // Ensure the parsed value is a real positive number
      if (!isNaN(parsed) && parsed > 0) {
        return parsed;
      }
      // Otherwise fall back to frame window size or a 150px default
      if (fallbackWindowVal && fallbackWindowVal > 0) {
        return fallbackWindowVal;
      }
      return 150;
    }

    const params = new URLSearchParams(window.location.search);
    
    // Safely parse parameters with fail-safes
    const targetW = getValidDimension(params.get("w"), window.innerWidth);
    const targetH = getValidDimension(params.get("h"), window.innerHeight);

    // Apply dimensions to both buffer and inline styles
    canvas.width = targetW;
    canvas.height = targetH;
    canvas.style.width = targetW + "px";
    canvas.style.height = targetH + "px";

    const r = new rive.Rive({
      src: "round.riv",
      canvas: canvas,
      stateMachines: "State Machine 1",
      autoplay: true,
      automaticallyHandleEvents: false,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      })
    });
  </script>

</body>
</html>
