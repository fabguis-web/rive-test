<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #rive-canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* Hard-hide canvas until JS explicitly reveals it */
      display: none;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>
  <canvas id="rive-canvas"></canvas>
  <script>
    const rivUrl = new URL("round.riv", window.location.href).href;
    const canvasElement = document.getElementById("rive-canvas");

    const r = new rive.Rive({
      src: rivUrl,
      canvas: canvasElement,
      autoplay: false, /* Disabled to stop initial pre-render */
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        
        // Play timeline animation directly
        const anims = r.animationNames;
        if (anims && anims.length > 0) {
          r.play(anims[0]);
        } else {
          r.play();
        }
        
        // Reveal canvas ONLY when actively playing
        canvasElement.style.display = "block";
      },
      onLoadError: (err) => {
        console.error("Rive Asset Load Failure:", err);
      }
    });

    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
