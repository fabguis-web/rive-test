<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
    }

    /* Constrains the canvas size cleanly inside the iframe */
    #rive-canvas {
      width: 200px !important;
      height: 200px !important;
      max-width: 100%;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    const r = new rive.Rive({
      src: "round.riv",
      canvas: document.getElementById("rive-canvas"),
      stateMachines: "State Machine 1",
      autoplay: true,
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
      },
    });
  </script>

</body>
</html>
