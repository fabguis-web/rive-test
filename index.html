<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #rive-canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* Keep hidden during compilation */
      display: none;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>
  <canvas id="rive-canvas"></canvas>
  <script>
    const rivUrl = new URL("round.riv", window.location.href).href;
    const canvasElement = document.getElementById("rive-canvas");

    const r = new rive.Rive({
      src: rivUrl,
      canvas: canvasElement,
      autoplay: false,
      /* Explicitly lock to State Machine 1 so it ignores 'colors' */
      stateMachines: "State Machine 1",
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        
        // Start State Machine 1 directly
        r.play("State Machine 1");
        
        // Reveal canvas only after active playback begins
        canvasElement.style.display = "block";
      },
      onLoadError: (err) => {
        console.error("Rive Asset Load Failure:", err);
      }
    });

    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
