<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
    }

    #rive-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script>
    let r;
    
    function initRive() {
      r = new rive.Rive({
        src: "round.riv",
        canvas: document.getElementById("rive-canvas"),
        stateMachines: "State Machine 1",
        autoplay: true,
        layout: new rive.Layout({
          fit: rive.Fit.Contain,
          alignment: rive.Alignment.Center
        }),
        onLoad: () => {
          r.resizeDrawingSurfaceToCanvas();
        },
      });
    }

    // Trigger on load to handle cached iframe initializations
    if (document.readyState === 'complete') {
      initRive();
    } else {
      window.addEventListener('load', initRive);
    }

    // Recalculate canvas surface if container dimensions update dynamically
    window.addEventListener('resize', () => {
      if (r) r.resizeDrawingSurfaceToCanvas();
    });
  </script>

</body>
</html>
