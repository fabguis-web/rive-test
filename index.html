<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #rive-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
</head>
<body>
  <canvas id="rive-canvas"></canvas>
  <script>
    /* Use an absolute URL path to prevent local root fetch failures */
    const rivUrl = window.location.origin + window.location.pathname.replace(/\/$/, "") + "/round.riv";

    const r = new rive.Rive({
      src: rivUrl,
      canvas: document.getElementById("rive-canvas"),
      autoplay: true,
      stateMachines: "State Machine 1",
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
      },
      onLoadError: (err) => {
        console.error("Rive failed to load asset:", err);
      }
    });

    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
