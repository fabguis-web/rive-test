<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rive Embed</title>
  <style>
    /* Force body and canvas to expand to full screen boundaries */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #rive-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/@rive-app/canvas@2.9.1"></script>
</head>
<body>
  <canvas id="rive-canvas"></canvas>
  <script>
    const r = new rive.Rive({
      src: "round.riv",
      canvas: document.getElementById("rive-canvas"),
      autoplay: true,
      stateMachines: "State Machine 1",
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
      }
    });

    /* Recalculate drawing surface if the window resizes */
    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
